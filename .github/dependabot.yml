version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 14
    groups:
      routine-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # typescript 7.x breaks CI: @astrojs/check@0.9.10 (latest) only supports
      # typescript ^5.0.0 || ^6.0.0, so `npm ci` fails on peer-dependency
      # resolution. Remove once @astrojs/check adds TS 7 support.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - "*"
