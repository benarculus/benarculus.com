name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      site_mode:
        description: Pages artifact mode to publish
        type: choice
        default: preview
        options:
          - preview
          - production

env:
  SITE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.site_mode || 'preview' }}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-pages:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.8.0
          cache: npm
      # actions/configure-pages v5.0.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run validate
      - name: Build selected Pages artifact
        run: |
          if [ "$SITE_MODE" = "production" ]; then
            npm run build
            npm run test:generated
          else
            npm run build:preview
            npm run test:generated:preview
          fi
      - name: Reject hidden files in the artifact
        run: |
          if find dist -type f \( -name '.*' -o -path '*/.*/*' \) -print -quit | grep -q .; then
            echo "Hidden files must not be published."
            exit 1
          fi
      # actions/upload-pages-artifact v3.0.1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
          retention-days: 1

  deploy-pages:
    name: Deploy Pages
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      # actions/deploy-pages v4.0.5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
